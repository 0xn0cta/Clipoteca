<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100B0D" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('clipoteca-theme-mode')
          const mode = ['system', 'dark', 'light'].includes(stored) ? stored : 'system'
          const light = mode === 'light' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          const resolved = light ? 'light' : 'dark'
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.themeMode = mode
          document.documentElement.style.colorScheme = resolved
          document.querySelector('meta[name="theme-color"]').content = light ? '#F4F0F1' : '#100B0D'
        } catch {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.themeMode = 'system'
        }
      })()
    </script>
    <meta
      name="description"
      content="Clipoteca — prepara y revisa tus descargas de video y playlists."
    />
    <title>Clipoteca — Tu archivo personal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
